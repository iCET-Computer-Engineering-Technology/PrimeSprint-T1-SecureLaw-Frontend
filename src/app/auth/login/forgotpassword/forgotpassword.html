<div class="google-bg">
	<div class="google-card">
		<h1 class="google-title">Sign in</h1>
		<div class="google-subtext">with your Google Account to continue to Gmail. This account will be available to other Google apps in the browser.</div>
		<form class="google-form">
			<input type="email" id="email" name="email" placeholder="Email or phone" required>
			<div class="google-links">
				<a href="#" class="google-link">Forgot email?</a>
			</div>
			<div class="google-actions">
				<a href="#" class="google-link">Create account</a>
				<button type="submit" class="google-btn" (click)="forgotPassword()">Next</button>
			</div>
		</form>
		<div class="google-guest">Not your computer? Use Guest mode to sign in privately. <a href="#" class="google-link">Learn more about using Guest mode</a></div>
	</div>
</div>
