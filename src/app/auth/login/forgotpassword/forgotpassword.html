<div class="forgot-password-container">
  <form class="forgot-password-form" autocomplete="off" (ngSubmit)="onSubmit()">
    <div class="form-header">
      <div class="icon-circle">
        <svg width="32" height="32" fill="none" stroke="#4a4e69" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="13" rx="2" stroke="#4a4e69"/>
          <path d="M16 3v4M8 3v4" stroke="#4a4e69"/>
        </svg>
      </div>
      <h2>Forgot Password</h2>
      <p class="subtitle">Enter your email and new password to reset.</p>
    </div>

    <!-- Message Box -->
    <div *ngIf="message" [ngClass]="messageType === 'success' ? 'alert-success' : 'alert-error'">
      {{ message }}
    </div>

    <div class="input-group">
      <label for="email">Email Address</label>
      <div class="input-icon">
        <input type="email" id="email" placeholder="Email address"
               [(ngModel)]="email" name="email" required class="input-email" />
      </div>
    </div>

    <div class="input-group">
      <label for="newPassword">New Password</label>
      <div class="input-icon">
        <input type="password" id="newPassword" placeholder="New password"
               [(ngModel)]="newPassword" name="newPassword" required class="input-email" />
      </div>
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-icon">
        <input type="password" id="confirmPassword" placeholder="Confirm password"
               [(ngModel)]="confirmPassword" name="confirmPassword" required class="input-email" />
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      {{ loading ? 'Resetting...' : 'Reset Password' }}
    </button>
    <a routerLink="/login" class="back-link">Back to Login</a>
  </form>
</div>
