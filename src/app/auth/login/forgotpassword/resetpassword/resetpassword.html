<div class="google-bg">
	<div class="google-card">
		<h1 class="google-title">Reset your password</h1>
		<div class="google-subtext">with your Google Account to continue to Gmail. This account will be available to other Google apps in the browser.</div>
		<form class="google-form">
			<input type="password" id="resetPassword" name="resetPassword" placeholder="New password" required>
			<div class="google-links">
				New Password: <input type="password" id="newPassword" name="newPassword" placeholder=" new password" required>
			</div>
			<div class="button"	>
				<button type="submit" class="google-btn" routerLink="/login">Reset Password</button>
			</div>
			</form>
		<div class="google-guest">Not your computer? Use Guest mode to sign in privately. <a href="#" class="google-link">Learn more about using Guest mode</a></div>
	</div>
</div>
